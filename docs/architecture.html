<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenStake — architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:36px 36px 26px; background:#020617; color:#e2e8f0;
         font-family:"JetBrains Mono", ui-monospace, monospace; }
  .head { display:flex; align-items:center; gap:12px; }

           background:radial-gradient(1100px 520px at 18% 0%, rgba(30,41,59,.55), #020617 72%); }
  footer { margin-top:14px; font-size:11px; color:#475569; letter-spacing:.08em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="head"><span class="dot"></span><h1>OpenStake · system architecture</h1></div>
  <p class="sub">server-authoritative play money floor · next.js 16 · drizzle · pglite · hmac-sha256 fairness</p>

      <rect width="1460" height="720" fill="url(#grid)" opacity="0.5"/>

        <text x="50" y="372" fill="#fb7185" font-size="11">signed guest cookie</text>

        <text x="50" y="442" fill="#64748b" font-size="10">The seat lives in a cookie.</text>

        <text x="482" y="414" fill="#cbd5e1" font-size="11">platform/container.ts (DI)</text>
        <text x="482" y="442" fill="#64748b" font-size="10">no client-generated outcomes</text>
      </g>

      <g>
        <rect x="820" y="70" width="302" height="402" rx="7" fill="#0f172a"/>

        <text x="842" y="128" fill="#e2e8f0" font-size="12">BettingService</text>
        <text x="842" y="146" fill="#94a3b8" font-size="10.5">instant + progression orchestration</text>
        <text x="842" y="174" fill="#e2e8f0" font-size="12">5 instant engines</text>

        <text x="842" y="438" fill="#64748b" font-size="10">pure engines, injected RandomSource</text>

      </g>
